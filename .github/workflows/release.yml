name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -q --ignore=tests/test_codecs_crypto.py --ignore=tests/test_voice_e2e.py

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build relay executable
        run: pyinstaller labhairliom-relay.spec
        shell: bash
        
      - name: Build client executable
        run: pyinstaller labhairliom-client.spec
        shell: bash
        
      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: labhairliom-relay-windows
          path: dist/labhairliom-relay.exe
          
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: labhairliom-client-windows
          path: dist/labhairliom-client.exe

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk
          
      - name: Install Buildozer
        run: |
          pip install buildozer cython
          
      - name: Build Android APK
        run: buildozer android debug
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: labhairliom-android
          path: bin/*.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/labhairliom-relay-windows/labhairliom-relay.exe
            artifacts/labhairliom-client-windows/labhairliom-client.exe
            artifacts/labhairliom-android/bin/*.apk
